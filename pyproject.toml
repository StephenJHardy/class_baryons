[project]
name = "class-baryons"
version = "0.1.0"
description = "CMB constraints on compact photon-coupled baryonic clumps using CLASS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "classy",
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
    "cobaya>=3.6.2",
    "astropy>=8.0.1",
    "py-bobyqa>=1.5.0",
]

[dependency-groups]
dev = [
    "ipykernel",
    "pip>=26.2.1",
    "pytest",
]

[tool.uv]
package = false

[tool.uv.sources]
# CLASS is cloned (not vendored) by scripts/setup_class.sh at the pinned tag.
classy = { path = "class_public" }
