# Frozen reference cosmology (plan Section 4). Planck 2018 TT,TE,EE+lowE+lensing
# best-fit-like values. Do not edit without an experiment-log entry.
name: baseline_lcdm

cosmology:
  omega_b: 0.02237
  omega_dm: 0.1200        # total pressureless dark matter; split into cdm + idm
  100*theta_s: 1.04190   # CLASS theta_s (not Planck theta_MC); gives h ~ 0.674
  n_s: 0.9649
  ln10^{10}A_s: 3.044
  tau_reio: 0.0544
  N_ur: 2.0328
  N_ncdm: 1
  m_ncdm: 0.06
  YHe: BBN

output:
  output: tCl,pCl,lCl,mPk
  lensing: 'yes'
  l_max_scalars: 3000
  P_k_max_h/Mpc: 20.0
  z_pk: 0.0

# CLASS precision settings (see doc/IMPLEMENTATION_NOTES.md and the
# 2026-09-25 M2a experiment-log entry for how these were chosen).
precision:
  # 4x the default thermodynamics table. At the default, moving the table's
  # start redshift (which CLASS does whenever idm is present) changes C_l by
  # up to 2e-3.
  thermo_Nz_lin: 80000
  thermo_Nz_log: 20000
  # Start perturbations 10x earlier than default. CLASS initialises
  # theta_idm = theta_g, a decaying velocity mode for uncoupled idm that
  # otherwise leaves ~5e-4 residuals at l < 30.
  start_small_k_at_tau_c_over_tau_h: 1.5e-4
  start_large_k_at_tau_h_over_tau_k: 7.0e-3

# Idm defaults (plan Sections 4-5); m_idm in eV. From M2b: outputs are
# converged in m_idm from ~1e8 eV and bit-identical from 1e24 eV (the
# thermal T/m terms fall below double precision), so the clump mass drops
# out exactly. CLASS's own default is 1e9 eV.
idm:
  m_idm: 1.0e+27
  n_index_idm_g: 0

# Analysis ranges.
ell_min: 2
ell_max: 2500
k_min_h: 1.0e-4
k_max_h: 10.0
n_k: 400
